[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "BioSpliceView"
version = "1.1.0"
description = "Annotate rMATS alternative splicing events: isoform CDS/protein reconstruction, frameshift detection, NMD classification and GenBank export"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "BioSpliceView contributors" }]
keywords = ["rMATS", "alternative splicing", "NMD", "GenBank", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3",
    "openpyxl>=3.0",
    "pyfaidx>=0.7",
    "biopython>=1.79",
]

[project.scripts]
biospliceview = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts"]
